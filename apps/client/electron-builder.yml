# Local packaging only (SPEC 15.1). Builds are unsigned or ad-hoc signed.
# Production signing and notarization need Rex's separate approval (docs/CERTIFICATES.md).
appId: ai.verafy.henge
productName: Henge
copyright: Copyright Verafy
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
artifactName: SwarmExplorer-${version}-${os}-${arch}.${ext}
protocols:
  - name: Henge
    schemes: [henge]
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
mac:
  category: public.app-category.developer-tools
  target: [zip]
  # "-" is an ad-hoc signature: no certificate, no Developer ID, not notarized. Apple silicon
  # kills unsigned binaries, and flipping fuses invalidates Electron's original signature.
  identity: '-'
  hardenedRuntime: false
win:
  target: [zip]
  signAndEditExecutable: false
linux:
  target: [tar.gz]
  category: Development
publish: null
