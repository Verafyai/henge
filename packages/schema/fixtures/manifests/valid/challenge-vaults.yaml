# Launch configuration (SPEC 16.1, 18.3): volunteer, impact only, until a funded pool is approved.
# Source values from SPEC 6.3 where given; everything else is a fixture illustration.
# Nodes run only the model and return candidate proofs as text, so the harness is WebAssembly with no
# network; Lean checking runs on the coordinator as the machine-check verifier (decision 2026-11-25).
manifest_version: 1
id: challenge-vaults
name: Challenge Vaults
publisher: verafy.ai
category: mathematics
summary: Search for Lean proofs of open Erdos problems
harness: { name: lean-prover, version: 1.4.0, hash: sha256-41579b824c0e1eec59a4dfc83da647239c1b8e7020da622d96d2d32262d30d42, runtime: wasm }
models: { policy: class, class: code-7b-plus, api_allowed: true }
verification: [machine-check]
verification_config: { pending_window_s: 604800 }
permissions:
  network: []
  scratch_disk_gb: 2
  gpu_compute: false
  api_spend_daily_usd: null
credits: { funded: false, per_accepted_task: null, pool_id: null }
impact: { category_weight: 1 }
task:
  timeout_s: 900
  max_parallel_per_node: 1
  urgent_allowed: false
  input_schema: https://vaults.verafy.ai/schemas/lemma-task.json
  output_schema: https://vaults.verafy.ai/schemas/proof-result.json
qualification: { tasks: 3, pass: 2 }
results_url: https://vaults.verafy.ai/results
coordinator: { mode: hosted, url: null, public_key: null }
data_policy: { public_inputs: true, retention_days: 365, sensitive_data_prohibited: true }
min_client_version: 0.1.0
x-example: Fixture manifest. Impact weight, retention and schema URLs are illustrations, not deployment values.
